<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>바지 | STYLEHAUS</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-category="pants">
  <div id="header"></div>

  <main class="container">
    <div class="page-head">
      <nav class="breadcrumb" aria-label="현재 위치"><a href="index.html">홈</a> &gt; 바지</nav>
      <h1 class="page-title">바지</h1>
    </div>

    <div class="chips" id="subFilters" aria-label="세부 카테고리"></div>

    <div class="toolbar">
      <span id="count"></span>
      <select id="sort" aria-label="정렬">
        <option value="recommend">추천순</option>
        <option value="low">낮은 가격순</option>
        <option value="high">높은 가격순</option>
        <option value="discount">할인율순</option>
        <option value="review">후기 많은순</option>
      </select>
    </div>

    <ul class="product-grid" id="grid"></ul>
  </main>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/products.js"></script>
  <script src="js/db.js"></script>
  <script src="js/common.js"></script>
  <script src="js/category.js"></script>
</body>
</html>
